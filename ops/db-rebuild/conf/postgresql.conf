# 新 DB 共通設定。プロファイル固有の値は末尾の include で読む
# (bulk: 一括投入用、steady: 定常運用用)。
# config_file をデータディレクトリ外に置くため、hba_file と ident_file は明示する。
# 未指定だと config_file のあるディレクトリを探してしまう。
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

listen_addresses = '*'
max_connections = 100

# 本番ホストの RAM 15GB は他コンテナと共用する。
# shared_buffers はホスト RAM の約 20% に抑え、残りは OS のページキャッシュに任せる。
shared_buffers = 3GB
effective_cache_size = 8GB
work_mem = 32MB
# 分けないと autovacuum_max_workers 本ぶんの maintenance_work_mem が同時に確保される。
autovacuum_work_mem = 256MB
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ストレージが rotational=1 と報告されるため、既定値のまま変えない。
# 実行計画の変化を検証せずに変更しない。
random_page_cost = 4

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = on
compute_query_id = on

# vacuum の global 設定。大きい表は表ごとに scale_factor をさらに下げる。
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.05
autovacuum_naptime = 30s
autovacuum_max_workers = 4
autovacuum_vacuum_cost_limit = 1000

# TOAST の既定圧縮。Observation.classificationSnapshot は baseline 側でも明示する。
default_toast_compression = 'lz4'
wal_compression = lz4

checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

log_min_duration_statement = 1000
log_autovacuum_min_duration = 1000
log_checkpoints = on
log_lock_waits = on

timezone = 'UTC'
log_timezone = 'UTC'

include '/etc/postgresql-new/profile.conf'
