# 一括投入プロファイル。
# wal_level=minimal では、同一トランザクションで作成した表への COPY の WAL が省略される。
# max_wal_senders=0 と archive_mode=off は wal_level=minimal の必須条件で、
# WAL アーカイブ、pg_basebackup、レプリケーションとは両立しない。
# 投入中のクラッシュは復旧せず、新 DB を作り直す (旧 DB は無傷)。
wal_level = minimal
max_wal_senders = 0
archive_mode = off

maintenance_work_mem = 2GB
# 並列ワーカーごとに maintenance_work_mem を確保するため、mem_limit に収まるよう 1 本に絞る。
max_parallel_maintenance_workers = 1
max_wal_size = 32GB
min_wal_size = 4GB

# COPY FREEZE 済みの表を投入中の autovacuum に触らせない。
autovacuum = off
# 投入中のコミットはクラッシュ時に捨てる前提のため、WAL の同期を待たない。fsync は止めない。
synchronous_commit = off
