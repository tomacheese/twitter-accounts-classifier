# 一括投入プロファイル。
# wal_level=minimal では、同一トランザクションで作成した表への COPY の WAL が省略される。
# max_wal_senders=0 と archive_mode=off は wal_level=minimal の必須条件で、
# WAL アーカイブ、pg_basebackup、レプリケーションとは両立しない。
# 投入中のクラッシュは復旧せず、新 DB を作り直す (旧 DB は無傷)。
wal_level = minimal
max_wal_senders = 0
archive_mode = off

maintenance_work_mem = 2GB
max_wal_size = 32GB
min_wal_size = 4GB

# COPY FREEZE 済みの表を投入中の autovacuum に触らせない。
# steady へ切り替えると有効になり、switch-to-steady.sh が ANALYZE も実行する。
autovacuum = off
# fsync と full_page_writes は止めない。
synchronous_commit = off
