# 定常運用プロファイル。物理バックアップ (pg_basebackup と WAL アーカイブ) を前提にする。
wal_level = replica
max_wal_senders = 4
archive_mode = on
# /wal-archive は NEW_DB_WAL_ARCHIVE_HOST_PATH のマウント。
# 既存ファイルは上書きせず失敗させ、コピー途中のファイルが最終名で残らないよう一時名から mv する。
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f.tmp && mv /wal-archive/%f.tmp /wal-archive/%f'
archive_timeout = 15min

maintenance_work_mem = 1GB
max_wal_size = 8GB
min_wal_size = 1GB

autovacuum = on
synchronous_commit = on
