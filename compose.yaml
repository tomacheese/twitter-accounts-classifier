x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # 本番機のホスト RAM 15GB は Postgres・crawler・viewer で共有しており、
    # postgres:17-alpine の既定値 (shared_buffers=128MB、work_mem=4MB) は小さすぎるため調整する。
    # ストレージは HDD のため、random_page_cost は既定値の 4 から変更しない。
    # SSD/NVMe 向けの低い値に下げると、ランダムアクセスの実コストを過小評価し、
    # 非効率な実行計画を選ばせる恐れがある。
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=10GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: twitter_accounts_classifier
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d twitter_accounts_classifier"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # crawler と viewer の両方がマイグレーション適用済みの状態を前提にできるよう、
  # 一度だけ実行して完了する専用サービスに分離する。crawler の entrypoint.sh も
  # 起動時に prisma migrate deploy を実行するが、これは冪等なため二重実行しても
  # 無害であり、このサービスなしで crawler 単体を起動する経路の保険として残す。
  migrate:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crawler:crawler@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}
      VIEWER_DB_PASSWORD: ${VIEWER_DB_PASSWORD:?VIEWER_DB_PASSWORD must be set in .env}
      ANALYZER_DB_PASSWORD: ${ANALYZER_DB_PASSWORD:?ANALYZER_DB_PASSWORD must be set in .env}
    entrypoint:
      [
        "sh",
        "-c",
        "cd /app/crawler && pnpm exec prisma migrate deploy --schema=../prisma/schema.prisma && cd /app && bash scripts/db/run-migration-and-sync-grants.sh",
      ]
    logging: *default-logging

  crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://crawler:crawler@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}
      COOKIE_ISSUER_URL: ${COOKIE_ISSUER_URL:?COOKIE_ISSUER_URL must be set in .env}
      CRAWL_INTERVAL_SECONDS: "10800"
      CRAWL_STALE_THRESHOLD_MULTIPLIER: ${CRAWL_STALE_THRESHOLD_MULTIPLIER:-3}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      CRAWL_WARNING_THRESHOLD: ${CRAWL_WARNING_THRESHOLD:-}
    volumes:
      # entrypoint.sh cds into /app/crawler before running anything, and
      # loadConfig()'s default path ('data/config.json') is relative to that
      # cwd, so the bind mount target must be /app/crawler/data (not /app/data).
      - ./data:/app/crawler/data
    logging: *default-logging

  viewer:
    build:
      context: .
      dockerfile: viewer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # viewer は読み取り専用の viewer ロール (scripts/db/create-viewer-role.sql) で接続する。
      # crawler ロールで接続すると、DB 側で強制している SELECT のみの制約が意味を持たなくなる。
      DATABASE_URL: postgresql://viewer:${VIEWER_DB_PASSWORD:?VIEWER_DB_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}
      # Docker sets HOSTNAME to the container ID by default; Next.js's
      # standalone server.js binds to that literal value instead of all
      # interfaces — override it so the server (and the healthcheck's
      # localhost probe) works.
      HOSTNAME: "0.0.0.0"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      VIEWER_NEW_UI_SECTIONS: ${VIEWER_NEW_UI_SECTIONS:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          # 127.0.0.1, not localhost: the container's DNS resolves localhost to ::1
          # first, and the server (bound to 0.0.0.0, IPv4-only) doesn't answer there,
          # so the fetch stalls for several seconds before falling back to IPv4 and
          # blows past the timeout below.
          #
          # '/' ではなく /api/health: ダッシュボードのルートは KPI/ラベル分布のクエリを実行し、DB にアクセスする
          # (際限なく増え続ける AccountLabel 履歴ではなく上限のある AccountLabelLatest テーブルに対してだが、
          # 通常のコネクションプール/DB 負荷の影響は依然として受ける)。
          # /api/health は DB に一切触れない単純な liveness probe なので、クエリ負荷に関係なく高速であり続ける。
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 8s
      retries: 5
    logging: *default-logging

  blocker:
    build:
      context: .
      dockerfile: blocker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://crawler:crawler@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}
      COOKIE_ISSUER_URL: ${COOKIE_ISSUER_URL:?COOKIE_ISSUER_URL must be set in .env}
      BLOCK_INTERVAL_SECONDS: ${BLOCK_INTERVAL_SECONDS:-21600}
      BLOCK_STALE_THRESHOLD_MULTIPLIER: ${BLOCK_STALE_THRESHOLD_MULTIPLIER:-3}
      BLOCK_ACTION_DELAY_MS: ${BLOCK_ACTION_DELAY_MS:-2000}
      BLOCK_MAX_PER_ACCOUNT_PER_RUN: ${BLOCK_MAX_PER_ACCOUNT_PER_RUN:-50}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
    volumes:
      # blocker/entrypoint.sh は何よりも先に /app/blocker へ cd してから起動するため、
      # loadBlockerConfig() のデフォルトパス ('data/config.json') もそのカレントディレクトリ
      # からの相対パスになる。そのためバインドマウント先は /app/blocker/data とする必要がある
      # (/app/data ではない)。
      - ./data:/app/blocker/data
    logging: *default-logging

  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # crawler/blocker/viewer と異なり、analyzer は正本テーブルへ SELECT のみ・
      # 分析/運用テーブルへ書き込み可能な allowlist 権限の analyzer ロールで接続する
      # (scripts/db/create-analyzer-role.sql 参照)。
      # label metric refresh は全 Label を一時的に並列投入するため、有限件数のキュー待ちは失敗させない。
      DATABASE_URL: postgresql://analyzer:${ANALYZER_DB_PASSWORD:?ANALYZER_DB_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}?pool_timeout=0
      ANALYZER_WORKER_CONCURRENCY: ${ANALYZER_WORKER_CONCURRENCY:-1}
      ANALYZER_POLL_INTERVAL_SECONDS: ${ANALYZER_POLL_INTERVAL_SECONDS:-10}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
    logging: *default-logging
