x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # PostgreSQL の parallel query は dynamic shared memory を /dev/shm に確保する。
    # 64MB の Docker 既定値では crawler と analyzer の同時集計で枯渇するため拡張する。
    shm_size: 512mb
    # 本番機のホスト RAM 15GB は Postgres・crawler・viewer で共有しており、
    # postgres:17-alpine の既定値 (shared_buffers=128MB、work_mem=4MB) は小さすぎるため調整する。
    # 本番は POSTGRES_DATA_HOST_PATH 経由で SSD (/mnt/ssd/twitter-accounts-classifier/postgres) を
    # マウントするが、random_page_cost は既定値の 4 から変更しない。この値は他プランと比べた
    # ランダムアクセスの相対コストを表すもので、ストレージ種別だけで機械的に下げてよい値ではなく、
    # 実行計画の変化を検証しないまま変更するのは避ける。
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=10GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
    environment:
      # 所有者 (superuser)。crawler ロールとは別にし、アプリ用ロールは migrate サービスが作る。
      POSTGRES_USER: ${DB_OWNER_USER:-tac_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD must be set in .env}
      POSTGRES_DB: twitter_accounts_classifier
    volumes:
      - ${POSTGRES_DATA_HOST_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USER:-tac_owner} -d twitter_accounts_classifier"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # スキーマは prisma/baseline から作る (prisma migrate deploy は実行しない)。
  # テーブルを所有する DB_OWNER_USER で baseline を適用し (適用済みなら何もしない)、
  # crawler・viewer・analyzer の各ロールを作って権限を同期する。
  # crawler ロールは所有者でも superuser でもなく、ラベル状態の書き込みは set_label_result に限られる。
  # 他のサービスはこのサービスの完了後に起動するため、アプリ用ロールは所有者と別にしなければならない。
  migrate:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_OWNER_USER:-tac_owner}:${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}
      CRAWLER_DB_PASSWORD: ${CRAWLER_DB_PASSWORD:?CRAWLER_DB_PASSWORD must be set in .env}
      VIEWER_DB_PASSWORD: ${VIEWER_DB_PASSWORD:?VIEWER_DB_PASSWORD must be set in .env}
      ANALYZER_DB_PASSWORD: ${ANALYZER_DB_PASSWORD:?ANALYZER_DB_PASSWORD must be set in .env}
    entrypoint:
      [
        "sh",
        "-c",
        "cd /app && bash prisma/baseline/apply.sh && bash scripts/db/run-migration-and-sync-grants.sh",
      ]
    logging: *default-logging

  crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://crawler:${CRAWLER_DB_PASSWORD:?CRAWLER_DB_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}
      COOKIE_ISSUER_URL: ${COOKIE_ISSUER_URL:?COOKIE_ISSUER_URL must be set in .env}
      CRAWL_INTERVAL_SECONDS: "10800"
      CRAWL_STALE_THRESHOLD_MULTIPLIER: ${CRAWL_STALE_THRESHOLD_MULTIPLIER:-3}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      CRAWL_WARNING_THRESHOLD: ${CRAWL_WARNING_THRESHOLD:-}
    volumes:
      # entrypoint.sh は何よりも先に /app/crawler へ cd し、
      # loadConfig() の既定パス ('data/config.json') はその cwd からの相対パスになる。
      # そのため bind mount 先は /app/data ではなく /app/crawler/data にする。
      - ./data:/app/crawler/data
    logging: *default-logging

  relabeler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/app/relabeler-entrypoint.sh"]
    environment:
      # analyzer と同様、PostgreSQL の shared memory を圧迫しないよう DB 接続本数を絞る。
      DATABASE_URL: postgresql://crawler:${CRAWLER_DB_PASSWORD:?CRAWLER_DB_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}?connection_limit=5&pool_timeout=0
      RELABELER_INTERVAL_SECONDS: ${RELABELER_INTERVAL_SECONDS:-30}
      RELABELER_PRODUCER_BATCH_SIZE: ${RELABELER_PRODUCER_BATCH_SIZE:-5000}
      RELABELER_WORKER_BATCH_SIZE: ${RELABELER_WORKER_BATCH_SIZE:-2000}
      RELABELER_WORKER_CONCURRENCY: ${RELABELER_WORKER_CONCURRENCY:-1}
      # storage-guard が書く StorageCapacityState を見て relabel のクレームを止める circuit breaker のしきい値。
      RELABEL_STORAGE_WARNING_AVAILABLE_GIB: ${RELABEL_STORAGE_WARNING_AVAILABLE_GIB:-120}
      RELABEL_STORAGE_WARNING_USED_PERCENT: ${RELABEL_STORAGE_WARNING_USED_PERCENT:-75}
      RELABEL_STORAGE_BLOCKED_AVAILABLE_GIB: ${RELABEL_STORAGE_BLOCKED_AVAILABLE_GIB:-100}
      RELABEL_STORAGE_BLOCKED_USED_PERCENT: ${RELABEL_STORAGE_BLOCKED_USED_PERCENT:-80}
      RELABEL_STORAGE_HYSTERESIS_RESUME_AVAILABLE_GIB: ${RELABEL_STORAGE_HYSTERESIS_RESUME_AVAILABLE_GIB:-120}
      RELABEL_STORAGE_HYSTERESIS_RESUME_USED_PERCENT: ${RELABEL_STORAGE_HYSTERESIS_RESUME_USED_PERCENT:-75}
      RELABEL_STORAGE_MAX_STALE_SECONDS: ${RELABEL_STORAGE_MAX_STALE_SECONDS:-180}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
    logging: *default-logging

  storage-guard:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # entrypoint.sh は引数ありなら seed/crawl ループを飛ばしてそのまま exec するため、
    # crawler 用の image をそのまま流用しつつこのサービス専用のコマンドだけを差し替えられる。
    command: ["node", "dist/scripts/storage-guard-cycle.js"]
    environment:
      DATABASE_URL: postgresql://crawler:${CRAWLER_DB_PASSWORD:?CRAWLER_DB_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}?connection_limit=1&pool_timeout=0
      STORAGE_GUARD_INTERVAL_SECONDS: ${STORAGE_GUARD_INTERVAL_SECONDS:-60}
      POSTGRES_DATA_PATH: /data/postgres
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
    volumes:
      # postgres service と同じホストパスを読み取り専用でマウントし、
      # ファイルシステムの実測値 (df) を計測する。DB 内部のサイズ推定には依らない。
      - ${POSTGRES_DATA_HOST_PATH:-./data/postgres}:/data/postgres:ro
    logging: *default-logging

  viewer:
    build:
      context: .
      dockerfile: viewer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # viewer は原則読み取り専用の viewer ロール (scripts/db/create-viewer-role.sql) で接続する。
      # ComponentBuildIdentity の起動情報 upsert だけは INSERT/UPDATE を限定許可する。
      # crawler ロールで接続すると、DB 側の最小権限制約が意味を持たなくなる。
      DATABASE_URL: postgresql://viewer:${VIEWER_DB_PASSWORD:?VIEWER_DB_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}
      # Docker は HOSTNAME に既定でコンテナ ID を設定し、
      # Next.js の standalone server.js は全インターフェースではなくその値にバインドしてしまう。
      # サーバー (と healthcheck の localhost 向けプローブ) が動くように上書きする。
      HOSTNAME: "0.0.0.0"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      VIEWER_NEW_UI_SECTIONS: ${VIEWER_NEW_UI_SECTIONS:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          # localhost ではなく 127.0.0.1 を使う。
          # コンテナの DNS は localhost をまず ::1 に解決するが、0.0.0.0 にバインドした IPv4 のみのサーバーはそこで応答しない。
          # そのため fetch が IPv4 へフォールバックするまで数秒止まり、下の timeout を超えてしまう。
          #
          # '/' ではなく /api/health: ダッシュボードのルートは KPI/ラベル分布のクエリを実行し、DB にアクセスする
          # (際限なく増え続ける AccountLabel 履歴ではなく上限のある AccountLabelLatest テーブルに対してだが、
          # 通常のコネクションプール/DB 負荷の影響は依然として受ける)。
          # /api/health は DB に一切触れない単純な liveness probe なので、クエリ負荷に関係なく高速であり続ける。
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 8s
      retries: 5
    logging: *default-logging

  blocker:
    build:
      context: .
      dockerfile: blocker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://crawler:${CRAWLER_DB_PASSWORD:?CRAWLER_DB_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}
      COOKIE_ISSUER_URL: ${COOKIE_ISSUER_URL:?COOKIE_ISSUER_URL must be set in .env}
      BLOCK_INTERVAL_SECONDS: ${BLOCK_INTERVAL_SECONDS:-21600}
      BLOCK_STALE_THRESHOLD_MULTIPLIER: ${BLOCK_STALE_THRESHOLD_MULTIPLIER:-3}
      BLOCK_ACTION_DELAY_MS: ${BLOCK_ACTION_DELAY_MS:-2000}
      BLOCK_MAX_PER_ACCOUNT_PER_RUN: ${BLOCK_MAX_PER_ACCOUNT_PER_RUN:-50}
      BLOCK_TARGET_NOT_FOUND_MAX_ATTEMPTS: ${BLOCK_TARGET_NOT_FOUND_MAX_ATTEMPTS:-3}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
    volumes:
      # blocker/entrypoint.sh は何よりも先に /app/blocker へ cd してから起動するため、
      # loadBlockerConfig() のデフォルトパス ('data/config.json') もそのカレントディレクトリ
      # からの相対パスになる。そのためバインドマウント先は /app/blocker/data とする必要がある
      # (/app/data ではない)。
      - ./data:/app/blocker/data
    logging: *default-logging

  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # crawler/blocker/viewer と異なり、analyzer は正本テーブルへ SELECT のみ・
      # 分析/運用テーブルへ書き込み可能な allowlist 権限の analyzer ロールで接続する
      # (scripts/db/create-analyzer-role.sql 参照)。
      # label metric refresh は全 Label を一時的に並列投入する。PostgreSQL の shared memory を圧迫しないよう DB 接続を 1 本に直列化し、有限件数のキュー待ちは失敗させない。
      DATABASE_URL: postgresql://analyzer:${ANALYZER_DB_PASSWORD:?ANALYZER_DB_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-twitter_accounts_classifier}?connection_limit=1&pool_timeout=0
      ANALYZER_WORKER_CONCURRENCY: ${ANALYZER_WORKER_CONCURRENCY:-1}
      ANALYZER_POLL_INTERVAL_SECONDS: ${ANALYZER_POLL_INTERVAL_SECONDS:-10}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
    logging: *default-logging
