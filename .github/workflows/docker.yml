# GHCR に crawler/viewer/blocker の Docker image をビルド・公開する。

name: Docker

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/docker.yml
  pull_request_target:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed
  merge_group:

concurrency:
  # pull_request と pull_request_target が同一グループになると互いをキャンセルしてしまうため
  # event_name を含めることで両イベントのキャンセルを独立させる
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  deployments: write
  actions: read

jobs:
  post-approval-request:
    name: Post approval request
    runs-on: ubuntu-latest
    # フォーク PR のときのみ承認リクエストを投稿する（closed は不要）
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && github.event.action != 'closed'
    continue-on-error: true
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Find existing approval request comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Environment 承認待ち

      - name: Post or update approval request comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Environment 承認待ち

            この PR のビルドを実行するには、Environment `fork-pr-build` の承認が必要です。

            [Actions run を確認して承認してください](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }})

  approval-gate:
    name: Approval gate
    runs-on: ubuntu-latest
    needs: post-approval-request
    # post-approval-request の結果に関わらず常に実行する
    if: always()
    # フォーク PR かつ closed でない場合のみ Environment で手動承認が必要
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && github.event.action != 'closed' && 'fork-pr-build' || '' }}
    permissions: {}
    steps:
      - name: Approval granted
        run: echo "Approval gate passed"

  docker-ci:
    name: Docker CI
    needs: approval-gate
    if: always() && needs.approval-gate.result == 'success' && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    uses: book000/templates/.github/workflows/reusable-docker.yml@master
    with:
      targets: >-
        [
          { imageName: "tomacheese/twitter-accounts-classifier-crawler", context: ".", file: "crawler/Dockerfile", packageName: "twitter-accounts-classifier-crawler" },
          { imageName: "tomacheese/twitter-accounts-classifier-viewer", context: ".", file: "viewer/Dockerfile", packageName: "twitter-accounts-classifier-viewer" },
          { imageName: "tomacheese/twitter-accounts-classifier-blocker", context: ".", file: "blocker/Dockerfile", packageName: "twitter-accounts-classifier-blocker" },
          { imageName: "tomacheese/twitter-accounts-classifier-analyzer", context: ".", file: "analyzer/Dockerfile", packageName: "twitter-accounts-classifier-analyzer" }
        ]
      allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
    secrets:
      DOCKER_USERNAME: ${{ github.actor }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  docker-size-check:
    name: Docker image size check
    needs: approval-gate
    # pull_request イベント側では approval-gate の Environment 承認が発生しないため、
    # fork PR の Dockerfile でビルドが自動実行されないよう pull_request_target のみで動かす。
    if: github.event_name == 'pull_request_target' && needs.approval-gate.result == 'success' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target は既定で base branch を checkout するため、
          # PR の実際の変更内容を計測するため head SHA を明示する。
          ref: ${{ github.event.pull_request.head.sha }}
          # このジョブは git 操作を行わないため、fork PR のコードが同じ build context に
          # 含まれる credential を読み取れないよう永続化を無効化する。
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build images and measure size
        id: sizes
        shell: bash
        run: |
          {
            echo "## Docker image size (amd64, uncompressed)"
            echo ""
            echo "PR の変更を反映した image を amd64 のみでローカルビルドした際の uncompressed size (\`docker images\`)。GHCR 上の compressed size は merge 後に確認する。"
            echo ""
            echo "| service | Dockerfile | size |"
            echo "| --- | --- | ---: |"
          } > size-report.md

          declare -A targets=(
            [crawler]="crawler/Dockerfile"
            [blocker]="blocker/Dockerfile"
            [analyzer]="analyzer/Dockerfile"
            [viewer]="viewer/Dockerfile"
          )
          for name in crawler blocker analyzer viewer; do
            file="${targets[$name]}"
            tag="docker-size-check-${name}:latest"
            docker buildx build --load --build-arg TARGETARCH=amd64 -f "$file" -t "$tag" .
            # docker image inspect の Size は containerd snapshotter 環境で共有 layer を除いた過小な値を返すため、
            # docker images の表示サイズを使う。
            human=$(docker images "$tag" --format '{{.Size}}')
            echo "| $name | $file | $human |" >> size-report.md
            docker rmi "$tag"
          done

          cat size-report.md

      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Docker image size (amd64, uncompressed)

      - name: Post or update size comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: size-report.md
