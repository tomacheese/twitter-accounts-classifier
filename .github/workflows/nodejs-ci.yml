# Node.js でビルド・テストを実行する。バージョンは各パッケージの .node-version に記載されているものを利用する

name: Node CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  node-ci:
    name: Node CI
    uses: book000/templates/.github/workflows/reusable-nodejs-ci-pnpm.yml@master
    with:
      directorys: "crawler, viewer, twitter-client, blocker, analyzer"
      lock-path: "pnpm-lock.yaml"

  db-grants-verification:
    name: DB grants verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: twitter_accounts_classifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler -d twitter_accounts_classifier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crawler:crawler@localhost:5432/twitter_accounts_classifier
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: crawler/.node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm --filter crawler run db:migrate
      - name: Verify operational shell scripts
        run: |
          bash scripts/weekly-analyze-runtime.test.sh
          bash scripts/weekly-analyze-supervisor.test.sh
      - name: Verify service role bootstrap
        run: bash scripts/db/role-bootstrap.test.sh
      # weekly_review は外部開発機向けの任意ロールなので、専用の手動作成経路も別途検証する。
      - name: Create weekly review role with a CI-only test password
        run: |
          sed "s/CHANGE_ME_WEEKLY_REVIEW_PASSWORD/ci-test-password/" \
            create-weekly-review-role.sql > create-weekly-review-role.ci.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f create-weekly-review-role.ci.sql
          rm create-weekly-review-role.ci.sql
        working-directory: scripts/db
      - name: Sync and verify all grants
        env:
          VIEWER_DB_PASSWORD: ci-viewer-password
          ANALYZER_DB_PASSWORD: ci-analyzer-password
        run: bash scripts/db/run-migration-and-sync-grants.sh

  db-integration-tests:
    name: DB integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: twitter_accounts_classifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler -d twitter_accounts_classifier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # node-ci (reusable-nodejs-ci-pnpm.yml) には DB を用意できないため、
    # 実 DB 接続を必要とするテストは describe.skipIf(!process.env.DATABASE_URL) で
    # そちらでは skip し、このジョブでのみ実行する。
    env:
      DATABASE_URL: postgresql://crawler:crawler@localhost:5432/twitter_accounts_classifier
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: crawler/.node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm --filter crawler run db:migrate
      - name: Run analyzer tests
        run: pnpm --filter analyzer run test
      - name: Run crawler tests
        run: pnpm --filter crawler run test
      - name: Run blocker tests
        run: pnpm --filter blocker run test
      - name: Run viewer tests
        run: pnpm --filter viewer run test
